name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Server tests
        run: npm test -w server

      - name: Client tests
        run: npm test -w client

      - name: Client build (type-check + bundle)
        run: npm run build -w client
